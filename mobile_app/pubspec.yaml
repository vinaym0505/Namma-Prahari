name: namma_prahari
description: Citizen Mobile App for Namma Prahari Smart Civic Issue Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  supabase_flutter: ^2.3.4
  geolocator: ^10.1.0
  camera: ^0.10.5+9
  google_maps_flutter: ^2.5.3
  google_sign_in: ^6.2.1
  go_router: ^13.2.0
  lucide_icons: ^0.257.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
